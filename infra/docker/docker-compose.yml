services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: procure_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: procure_db
      POSTGRES_USER: procure_user
      POSTGRES_PASSWORD: procure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure_user -d procure_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procure_network

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: procure_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procure_network

  # ─── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: procure_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_PROFILE: dev
      DB_URL: jdbc:postgresql://postgres:5432/procure_db
      DB_USERNAME: procure_user
      DB_PASSWORD: procure_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-c2VjcmV0LWtleS1mb3ItcHJvY3VyZW1lbnQtc3lzdGVtLWNoYW5nZS1pbi1wcm9k}
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_MS: 604800000
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - procure_network

  # ─── Angular Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: procure_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - procure_network

  # ─── pgAdmin (DB GUI — optional, dev only) ──────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: procure_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@procure.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools
    networks:
      - procure_network

volumes:
  postgres_data:
  redis_data:

networks:
  procure_network:
    driver: bridge
